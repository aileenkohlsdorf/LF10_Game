<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage" tabindex="0">
  <canvas id="game" width="960" height="540"></canvas>

  <!-- UI-Ebene: 480x270 UI-Pixel, wird per JS auf die Spielgroesse skaliert -->
  <div id="ui">

    <!-- HUD im Spiel -->
    <div id="hud">
      <div id="hp-bar" role="img">
        <div id="hp-track"><div id="hp-fill"></div></div>
      </div>
      <div id="hearts" role="img" hidden></div>
      <div class="ammo-row">
        <div id="ammo" role="img"></div>
        <span id="reserve" role="img"><span id="reserve-count">0</span><span class="reserve-max">/50</span></span>
        <span id="reload-label" hidden>Nachladen …</span>
      </div>
    </div>

    <div id="hint">A/D laufen, Leertaste springen (2x = Doppelsprung)<br>Maus zielen, Klick schießen, R nachladen, Esc Pause</div>

    <!-- Pause -->
    <section class="screen screen-dim" data-screen="pause" hidden>
      <div class="panel menu-panel">
        <div class="menu-main">
          <h2>Pause</h2>
          <button type="button" class="btn btn-play" data-action="resume" aria-label="Weiterspielen" data-autofocus></button>
          <button type="button" class="btn btn-blank" data-action="restart"><span>Neustart</span></button>
          <button type="button" class="btn btn-blank" data-action="ask-map"><span>Zur Karte</span></button>
        </div>
        <div class="confirm" hidden>
          <h2>Zur Karte?</h2>
          <p class="confirm-text">Der Fortschritt in diesem Level geht verloren.</p>
          <div class="yes-no">
            <button type="button" class="btn-icon btn-yes" data-action="to-map" aria-label="Ja"></button>
            <button type="button" class="btn-icon btn-no" data-action="cancel" aria-label="Nein"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- Game Over -->
    <section class="screen screen-dim" data-screen="gameover" hidden>
      <div class="panel menu-panel">
        <h2 class="danger">Game Over</h2>
        <p class="meta">Keine Leben mehr.</p>
        <button type="button" class="btn btn-blank" data-action="restart" data-autofocus><span>Nochmal</span></button>
        <button type="button" class="btn btn-blank" data-action="to-map"><span>Zur Karte</span></button>
      </div>
    </section>

  </div>
</div>
<script src="game.js"></script>
</body>
</html>
