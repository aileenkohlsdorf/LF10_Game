<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>LF10 Game</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        #gameCanvas {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: min(100vw, 177.78vh);
            height: min(100vh, 56.25vw);

            display: block;
        }
    </style>
</head>

<body>

<canvas
    id="gameCanvas"
    width="1280"
    height="720">
</canvas>

<script src="js/overworld.js"></script>

</body>
</html>
